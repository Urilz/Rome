<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>מחשבון הוצאות משפחתי 2.4.9</title>
  <style>
    :root {
      --primary-color: #007bff;
      --secondary-color: #6c757d;
      --success-color: #28a745;
      --danger-color: #dc3545;
      --warning-color: #ffc107;
      --info-color: #17a2b8;
      --light-color: #f8f9fa;
      --dark-color: #343a40;
    }
    
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: #f5f5f5;
      margin: 0;
      padding: 10px;
      direction: rtl;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    
    h1, h2, h3 {
      text-align: center;
      color: var(--dark-color);
      margin-top: 5px;
      margin-bottom: 15px;
    }
    
    .currency-widget {
      background: #e9ecef;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      font-size: 0.9em;
    }
    
    .currency-item {
      display: flex;
      flex-direction: column;
    }
    
    .currency-value {
      font-weight: bold;
      color: var(--primary-color);
    }
    
    .form-group {
      margin-bottom: 12px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }
    
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #e9ecef;
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-weight: normal;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    .btn-danger {
      background-color: var(--danger-color);
      width: auto;
      padding: 5px 10px;
      font-size: 12px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 0.9em;
    }
    
    th, td {
      border: 1px solid #dee2e6;
      padding: 8px;
      text-align: right;
    }
    
    th {
      background-color: #f1f3f5;
    }
    
    .accordion-toggle {
      cursor: pointer;
      background-color: #f8f9fa;
    }
    
    .accordion-toggle:hover {
      background-color: #e9ecef;
    }
    
    .details-row {
      display: none;
      background-color: #ffffff;
    }
    
    .details-row.active {
      display: table-row;
    }
    
    .inner-table {
      width: 100%;
      margin: 5px 0;
      background-color: #f8f9fa;
    }
    
    .inner-table th {
      background-color: #e9ecef;
    }
    
    .settlement-card {
      background-color: #e2e3e5;
      border-right: 5px solid var(--info-color);
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 4px;
    }
    
    .sync-status {
      text-align: center;
      font-size: 0.8em;
      margin-top: 5px;
      color: var(--secondary-color);
    }

    .positive { color: var(--success-color); font-weight: bold; }
    .negative { color: var(--danger-color); font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>מחשבון הוצאות 2.4.9</h1>
  
  <!-- ווידג'ט שערי מטבע -->
  <div class="currency-widget">
    <div class="currency-item">
      <span>USD / ILS</span>
      <span class="currency-value" id="usdRate">טוען...</span>
    </div>
    <div class="currency-item">
      <span>EUR / ILS</span>
      <span class="currency-value" id="eurRate">טוען...</span>
    </div>
    <div class="currency-item">
      <span>GBP / ILS</span>
      <span class="currency-value" id="gbpRate">טוען...</span>
    </div>
  </div>

  <!-- טופס הזנת הוצאה -->
  <form id="expenseForm">
    <div class="form-group">
      <label for="payer">משפחה משלמת:</label>
      <select id="payer" required>
        <option value="">בחר משפחה...</option>
        <option value="אברהם">אברהם</option>
        <option value="לוי">לוי</option>
        <option value="כהן">כהן</option>
        <option value="ישראלי">ישראלי</option>
      </select>
    </div>

    <div class="form-group">
      <label for="amount">סכום (₪):</label>
      <input type="number" id="amount" step="0.01" min="0.1" required placeholder="0.00">
    </div>

    <div class="form-group">
      <label for="description">תיאור ההוצאה:</label>
      <input type="text" id="description" required placeholder="תיאור">
    </div>

    <div class="form-group">
      <label>משתתפים בהוצאה:</label>
      <div class="checkbox-group">
        <label class="checkbox-label"><input type="checkbox" name="participants" value="אברהם" checked> אברהם</label>
        <label class="checkbox-label"><input type="checkbox" name="participants" value="לוי" checked> לוי</label>
        <label class="checkbox-label"><input type="checkbox" name="participants" value="כהן" checked> כהן</label>
        <label class="checkbox-label"><input type="checkbox" name="participants" value="ישראלי" checked> ישראלי</label>
      </div>
    </div>

    <button type="submit">הוסף הוצאה</button>
  </form>

  <div class="sync-status" id="syncStatus">מצב סנכרון: מקומי</div>

  <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">

  <!-- טבלת סיכום -->
  <h2>סיכום מאזן</h2>
  <table>
    <thead>
      <tr>
        <th>משפחה</th>
        <th>שילמה</th>
        <th>חלק בהוצאות</th>
        <th>מאזן</th>
      </tr>
    </thead>
    <tbody id="summaryTableBody">
    </tbody>
  </table>

  <h3>הסדרי תשלום</h3>
  <div id="settlementList"></div>

  <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">

  <!-- יומן הוצאות -->
  <h2>יומן הוצאות</h2>
  <table>
    <thead>
      <tr>
        <th>תאריך</th>
        <th>משלם</th>
        <th>תיאור</th>
        <th>סכום</th>
        <th>פעולה</th>
      </tr>
    </thead>
    <tbody id="expensesLogTable">
    </tbody>
  </table>
</div>

<script>
  const ADMIN_PASS = "7350";
  const GOOGLE_SCRIPT_URL = ""; 
  const FAMILIES = ["אברהם", "לוי", "כהן", "ישראלי"];
  
  let expenses = JSON.parse(localStorage.getItem('expenses_db')) || [];

  document.addEventListener('DOMContentLoaded', () => {
    fetchCurrencyRates();
    renderAll();
    document.getElementById('expenseForm').addEventListener('submit', handleAddExpense);
  });

  function fetchCurrencyRates() {
    fetch('https://api.exchangerate-api.com/v4/latest/USD')
      .then(res => res.json())
      .then(data => {
        const ilsRate = data.rates.ILS;
        const eurRate = data.rates.EUR;
        const gbpRate = data.rates.GBP;

        document.getElementById('usdRate').textContent = '₪' + ilsRate.toFixed(2);
        document.getElementById('eurRate').textContent = '₪' + (ilsRate / eurRate).toFixed(2);
        document.getElementById('gbpRate').textContent = '₪' + (ilsRate / gbpRate).toFixed(2);
      })
      .catch(err => {
        console.error(err);
        document.getElementById('usdRate').textContent = 'שגיאה';
        document.getElementById('eurRate').textContent = 'שגיאה';
        document.getElementById('gbpRate').textContent = 'שגיאה';
      });
  }

  function formatMoney(num) {
    return Number(num).toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function handleAddExpense(e) {
    e.preventDefault();

    const payer = document.getElementById('payer').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const description = document.getElementById('description').value.trim();

    const descRegex = /^[\u0590-\u05FF\s'"\-]+$/;
    if (!descRegex.test(description)) {
      alert("תיאור ההוצאה חייב להיות בעברית בלבד.");
      return;
    }

    const participants = Array.from(document.querySelectorAll('input[name="participants"]:checked')).map(cb => cb.value);

    if (participants.length === 0) {
      alert("יש לבחור לפחות משפחה אחת משתתפת.");
      return;
    }

    const newExpense = {
      id: Date.now().toString(),
      date: new Date().toLocaleDateString('he-IL'),
      payer,
      amount,
      description,
      participants
    };

    expenses.push(newExpense);
    saveDataToSheet();
    renderAll();

    e.target.reset();
    document.querySelectorAll('input[name="participants"]').forEach(cb => cb.checked = true);
  }

  function deleteExpense(id) {
    const pass = prompt("הכנס סיסמת מנהל למחיקה:");
    if (pass === ADMIN_PASS) {
      expenses = expenses.filter(exp => exp.id !== id);
      saveDataToSheet();
      renderAll();
    } else if (pass !== null) {
      alert("סיסמה שגויה!");
    }
  }

  function saveDataToSheet() {
    localStorage.setItem('expenses_db', JSON.stringify(expenses));
    if (GOOGLE_SCRIPT_URL) {
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(expenses)
      });
    }
  }

  function renderAll() {
    renderSummary();
    renderLog();
  }

  function renderLog() {
    const tbody = document.getElementById('expensesLogTable');
    if (expenses.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">אין הוצאות רשומות</td></tr>';
      return;
    }

    tbody.innerHTML = expenses.slice().reverse().map(exp => `
      <tr>
        <td>${exp.date}</td>
        <td>${exp.payer}</td>
        <td>${exp.description}</td>
        <td>₪${formatMoney(exp.amount)}</td>
        <td>
          <button onclick="deleteExpense('${exp.id}')" class="btn-danger">מחק</button>
        </td>
      </tr>
    `).join('');
  }

  function renderSummary() {
    const summaryBody = document.getElementById('summaryTableBody');
    let totals = {};

    FAMILIES.forEach(fam => {
      totals[fam] = { paid: 0, share: 0, items: [] };
    });

    expenses.forEach(exp => {
      if (totals[exp.payer]) {
        totals[exp.payer].paid += exp.amount;
      }
      const splitAmount = exp.amount / exp.participants.length;
      exp.participants.forEach(part => {
        if (totals[part]) {
          totals[part].share += splitAmount;
          totals[part].items.push({
            description: exp.description,
            payer: exp.payer,
            cost: splitAmount
          });
        }
      });
    });

    let balances = [];
    let familySharesHtml = [];

    FAMILIES.forEach((fam, idx) => {
      const paid = totals[fam].paid;
      const share = totals[fam].share;
      const diff = paid - share;

      balances.push({ name: fam, diff });

      const diffClass = diff > 0 ? 'positive' : (diff < 0 ? 'negative' : '');

      familySharesHtml.push(`
        <tr class="accordion-toggle" onclick="toggleAccordion('acc-${idx}')">
          <td>${fam}</td>
          <td>₪${formatMoney(paid)}</td>
          <td>₪${formatMoney(share)}</td>
          <td class="${diffClass}">₪${formatMoney(diff)}</td>
        </tr>
        <tr id="acc-${idx}" class="details-row">
          <td colspan="4">
            <table class="inner-table">
              <thead>
                <tr>
                  <th>תיאור</th>
                  <th>משלם</th>
                  <th>חלק יחסי</th>
                </tr>
              </thead>
              <tbody>
                ${totals[fam].items.length > 0 ? totals[fam].items.map(item => `
                  <tr>
                    <td>${item.description}</td>
                    <td>${item.payer}</td>
                    <td>₪${formatMoney(item.cost)}</td>
                  </tr>
                `).join('') : '<tr><td colspan="3" style="text-align:center;">אין חיובים</td></tr>'}
              </tbody>
            </table>
          </td>
        </tr>
      `);
    });

    summaryBody.innerHTML = familySharesHtml.join('');

    let debtors = balances.filter(b => b.diff < -0.01).sort((a, b) => a.diff - b.diff);
    let creditors = balances.filter(b => b.diff > 0.01).sort((a, b) => b.diff - a.diff);

    let settlementHtml = '';
    let i = 0, j = 0;

    while (i < debtors.length && j < creditors.length) {
      let debtor = debtors[i];
      let creditor = creditors[j];
      let amount = Math.min(-debtor.diff, creditor.diff);

      settlementHtml += `
        <div class="settlement-card">
          משפחת <strong>${debtor.name}</strong> משלמת למשפחת <strong>${creditor.name}</strong>: <strong>₪${formatMoney(amount)}</strong>
        </div>
      `;

      debtor.diff += amount;
      creditor.diff -= amount;

      if (Math.abs(debtor.diff) < 0.01) i++;
      if (Math.abs(creditor.diff) < 0.01) j++;
    }

    document.getElementById('settlementList').innerHTML = settlementHtml || '<div style="text-align:center;">כל החשבונות מאוזנים!</div>';
  }

  function toggleAccordion(id) {
    const row = document.getElementById(id);
    if (row) {
      row.classList.toggle('active');
    }
  }
</script>

</body>
</html>
