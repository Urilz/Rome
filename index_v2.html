<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערכת ניהול וחלוקת הוצאות משפחתיות</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
      --warning-color: #f39c12;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    h1 {
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.2rem;
      color: var(--primary-color);
      margin-bottom: 15px;
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
    }

    .btn {
      background-color: var(--secondary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #2980b9;
    }

    .btn-success { background-color: var(--success-color); }
    .btn-success:hover { background-color: #27ae60; }
    
    .btn-excel { background-color: #1d6f42; }
    .btn-excel:hover { background-color: #155231; }

    .btn-danger { background-color: var(--danger-color); }
    .btn-danger:hover { background-color: #c0392b; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      text-align: right;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f1f1f1;
      color: var(--primary-color);
    }

    .accordion-toggle {
      cursor: pointer;
      background-color: #fdfdfd;
    }

    .accordion-toggle:hover {
      background-color: #f1f1f1;
    }

    .details-row {
      display: none;
      background-color: #f9f9f9;
    }

    .details-row.active {
      display: table-row;
    }

    .inner-table {
      margin: 10px 0;
      background: #fff;
    }

    .settlement-item {
      padding: 10px;
      background: #e8f8f5;
      border-right: 4px solid var(--success-color);
      margin-bottom: 8px;
      border-radius: 4px;
    }

    .empty-msg {
      text-align: center;
      color: #7f8c8d;
      padding: 15px;
    }

    #syncStatus {
      font-size: 0.9rem;
      padding: 5px 10px;
      border-radius: 4px;
      display: inline-block;
    }

    .status-ok { background-color: #d4edda; color: #155724; }
    .status-error { background-color: #f8d7da; color: #721c24; }
    .status-loading { background-color: #fff3cd; color: #856404; }

    .checkbox-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .checkbox-item input {
      width: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>מערכת ניהול הוצאות משפחתיות</h1>
    <p>גרסה 2.4.9 (מעודכנת)</p>
    <div style="margin-top: 10px;">
      סטטוס סנכרון: <span id="syncStatus" class="status-ok">מוכן</span>
    </div>
  </header>

  <!-- טופס הזנת הוצאה -->
  <div class="card">
    <div class="card-title">הזנת הוצאה חדשה</div>
    <form id="expenseForm">
      <div class="form-group">
        <label for="payer">משפחה משלמת:</label>
        <select id="payer" required>
          <option value="">בחר משפחה...</option>
          <option value="אברהם">אברהם</option>
          <option value="לוי">לוי</option>
          <option value="כהן">כהן</option>
          <option value="ישראלי">ישראלי</option>
        </select>
      </div>

      <div class="form-group">
        <label for="amount">סכום (₪):</label>
        <input type="number" id="amount" step="0.01" min="0.1" required placeholder="0.00">
      </div>

      <div class="form-group">
        <label for="description">תיאור ההוצאה:</label>
        <input type="text" id="description" required placeholder="לדוגמה: סופר שופרסל (קנייה 1)">
      </div>

      <div class="form-group">
        <label>משפחות משתתפות בהוצאה:</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" name="participants" value="אברהם" checked> אברהם</label>
          <label class="checkbox-item"><input type="checkbox" name="participants" value="לוי" checked> לוי</label>
          <label class="checkbox-item"><input type="checkbox" name="participants" value="כהן" checked> כהן</label>
          <label class="checkbox-item"><input type="checkbox" name="participants" value="ישראלי" checked> ישראלי</label>
        </div>
      </div>

      <button type="submit" class="btn btn-success">רושם הוצאה</button>
    </form>
  </div>

  <!-- סיכום ואיזון חובות -->
  <div class="card">
    <div class="card-title">
      <span>סיכום ואיזון חובות</span>
      <button onclick="exportToExcel()" class="btn btn-excel">ייצוא נתונים לאקסל</button>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>משפחה</th>
          <th>סה"כ שילמה</th>
          <th>סה"כ חובת חלקה</th>
          <th>מאזן (לבלוט/לחוב)</th>
          <th>פירוט</th>
        </tr>
      </thead>
      <tbody id="summaryTableBody">
        <!-- יתמלא דינמית -->
      </tbody>
    </table>

    <h3 style="margin-top: 20px; margin-bottom: 10px; color: var(--primary-color);">הסדרי תשלום מומלצים:</h3>
    <div id="settlementList">
      <!-- יתמלא דינמית -->
    </div>
  </div>

  <!-- יומן הוצאות -->
  <div class="card">
    <div class="card-title">יומן הוצאות כללי</div>
    <table>
      <thead>
        <tr>
          <th>תאריך</th>
          <th>משלם</th>
          <th>תיאור</th>
          <th>סכום</th>
          <th>משתתפים</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="expensesLogTable">
        <!-- יתמלא דינמית -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // קבועים והגדרות
  const ADMIN_PASS = "7350";
  const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; // נא להחליף במידת הצורך

  const FAMILIES = ["אברהם", "לוי", "כהן", "ישראלי"];
  let expenses = JSON.parse(localStorage.getItem('expenses_db')) || [];

  // אתחול
  document.addEventListener('DOMContentLoaded', () => {
    renderAll();
    
    document.getElementById('expenseForm').addEventListener('submit', handleAddExpense);
  });

  // עדכון הסטטוס במסך
  function setStatus(message, type) {
    const el = document.getElementById('syncStatus');
    el.textContent = message;
    el.className = 'status-' + type;
  }

  // פורמט מטבע
  function formatMoney(amount) {
    return Number(amount).toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // הוספת הוצאה
  function handleAddExpense(e) {
    e.preventDefault();

    const payer = document.getElementById('payer').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const description = document.getElementById('description').value.trim();
    
    // בדיקת תקינות תיאור בעברית כולל מספרים וסוגריים
    const descRegex = /^[\u0590-\u05FF0-9\s'"\-\(\)]+$/;
    if (!descRegex.test(description)) {
      alert("תיאור ההוצאה כולל תווים לא תקינים. נא להזין עברית, מספרים ופיסוק בסיסי בלבד.");
      return;
    }

    const participantCheckboxes = document.querySelectorAll('input[name="participants"]:checked');
    const participants = Array.from(participantCheckboxes).map(cb => cb.value);

    if (participants.length === 0) {
      alert("יש לבחור לפחות משפחה אחת משתתפת.");
      return;
    }

    const newExpense = {
      id: Date.now().toString(),
      date: new Date().toLocaleDateString('he-IL'),
      payer,
      amount,
      description,
      participants
    };

    expenses.push(newExpense);
    saveData();
    renderAll();
    
    // איפוס טופס
    e.target.reset();
    document.querySelectorAll('input[name="participants"]').forEach(cb => cb.checked = true);
  }

  // מחיקת הוצאה עם סיסמת מנהל
  function deleteExpense(id) {
    const pass = prompt("הכנס סיסמת מנהל למחיקה:");
    if (pass === ADMIN_PASS) {
      expenses = expenses.filter(exp => exp.id !== id);
      saveData();
      renderAll();
    } else if (pass !== null) {
      alert("סיסמה שגויה!");
    }
  }

  // שמירה וסנכרון מרחוק
  async function saveData() {
    localStorage.setItem('expenses_db', JSON.stringify(expenses));

    if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
      setStatus("נשמר מקומית בלבד", "ok");
      return;
    }

    setStatus("מסנכרן...", "loading");

    try {
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(expenses),
        redirect: 'follow'
      });

      if (response.ok) {
        setStatus("מסונכרן בהצלחה", "ok");
      } else {
        throw new Error("תגובת שרת לא תקינה");
      }
    } catch (err) {
      console.error("Sync Error:", err);
      setStatus("שגיאת סנכרון ברשת", "error");
    }
  }

  // רינדור כל התצוגות
  function renderAll() {
    renderSummary();
    renderLog();
  }

  // רינדור יומן הוצאות
  function renderLog() {
    const tbody = document.getElementById('expensesLogTable');
    if (expenses.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">אין הוצאות רשומות</td></tr>';
      return;
    }

    tbody.innerHTML = expenses.slice().reverse().map(exp => `
      <tr>
        <td>${exp.date}</td>
        <td><strong>${exp.payer}</strong></td>
        <td>${exp.description}</td>
        <td>${formatMoney(exp.amount)} ₪</td>
        <td>${exp.participants.join(', ')}</td>
        <td>
          <button onclick="deleteExpense('${exp.id}')" class="btn btn-danger" style="padding: 3px 8px; font-size: 0.8rem;">מחק</button>
        </td>
      </tr>
    `).join('');
  }

  // רינדור טבלת סיכום ואיזון
  function renderSummary() {
    const summaryBody = document.getElementById('summaryTableBody');
    
    let totals = {};
    FAMILIES.forEach(fam => {
      totals[fam] = { paid: 0, share: 0, items: [] };
    });

    expenses.forEach(exp => {
      if (totals[exp.payer]) {
        totals[exp.payer].paid += exp.amount;
      }
      
      const splitAmount = exp.amount / exp.participants.length;
      exp.participants.forEach(part => {
        if (totals[part]) {
          totals[part].share += splitAmount;
          totals[part].items.push({
            description: exp.description,
            payer: exp.payer,
            cost: splitAmount
          });
        }
      });
    });

    let balances = [];
    let summaryHtml = '';

    FAMILIES.forEach((fam, idx) => {
      const paid = totals[fam].paid;
      const share = totals[fam].share;
      const diff = paid - share;

      balances.push({ name: fam, diff });

      const diffClass = diff > 0 ? 'color: green; font-weight: bold;' : (diff < 0 ? 'color: red; font-weight: bold;' : '');

      summaryHtml += `
        <tr class="accordion-toggle" onclick="toggleAccordion('acc-${idx}')">
          <td><strong>${fam}</strong></td>
          <td>${formatMoney(paid)} ₪</td>
          <td>${formatMoney(share)} ₪</td>
          <td style="${diffClass}">${formatMoney(diff)} ₪</td>
          <td><button class="btn" style="padding: 2px 8px; font-size: 0.8rem;">פירוט ▾</button></td>
        </tr>
        <tr id="acc-${idx}" class="details-row">
          <td colspan="5">
            <table class="inner-table">
              <thead>
                <tr>
                  <th>תיאור ההוצאה</th>
                  <th>משלם מקורי</th>
                  <th>חלק יחסי</th>
                </tr>
              </thead>
              <tbody>
                ${totals[fam].items.length > 0 ? totals[fam].items.map(item => `
                  <tr>
                    <td>${item.description}</td>
                    <td>${item.payer}</td>
                    <td>${formatMoney(item.cost)} ₪</td>
                  </tr>
                `).join('') : '<tr><td colspan="3" class="empty-msg">אין חיובים</td></tr>'}
              </tbody>
            </table>
          </td>
        </tr>
      `;
    });

    summaryBody.innerHTML = summaryHtml;

    // חישוב הסדרי תשלום וקיזוז חובות
    let debtors = balances.filter(b => b.diff < -0.01).sort((a, b) => a.diff - b.diff);
    let creditors = balances.filter(b => b.diff > 0.01).sort((a, b) => b.diff - a.diff);

    let settlementHtml = '';
    let i = 0, j = 0;

    while (i < debtors.length && j < creditors.length) {
      let debtor = debtors[i];
      let creditor = creditors[j];
      let amount = Math.min(-debtor.diff, creditor.diff);

      settlementHtml += `
        <div class="settlement-item">
          משפחת <strong>${debtor.name}</strong> משלמת למשפחת <strong>${creditor.name}</strong>: <strong>${formatMoney(amount)} ₪</strong>
        </div>
      `;

      debtor.diff += amount;
      creditor.diff -= amount;

      if (Math.abs(debtor.diff) < 0.01) i++;
      if (Math.abs(creditor.diff) < 0.01) j++;
    }

    document.getElementById('settlementList').innerHTML = settlementHtml || '<div class="empty-msg">כל החשבונות מאוזנים!</div>';
  }

  // תפעול אקורדיון
  function toggleAccordion(id) {
    const row = document.getElementById(id);
    if (row) {
      row.classList.toggle('active');
    }
  }

  // ייצוא נתונים לאקסל (CSV) עם תמיכה מלאה בעברית
  function exportToExcel() {
    if (expenses.length === 0) {
      alert("אין נתונים לייצוא.");
      return;
    }

    let csvContent = "\uFEFF"; // BOM לתמיכה בעברית באקסל

    // חלק 1: יומן הוצאות
    csvContent += "יומן הוצאות\n";
    csvContent += "תאריך,משלם,תיאור,סכום,משתתפים\n";

    expenses.forEach(exp => {
      const desc = `"${exp.description.replace(/"/g, '""')}"`;
      const parts = `"${exp.participants.join(', ')}"`;
      csvContent += `${exp.date},${exp.payer},${desc},${exp.amount},${parts}\n`;
    });

    csvContent += "\n\n";

    // הורדת הקובץ
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `דוח_הוצאות_משפחתי_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>

</body>
</html>
